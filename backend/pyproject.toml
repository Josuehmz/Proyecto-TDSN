[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
asyncio_mode = "auto"
markers = [
    "perf: pruebas de rendimiento (lentas, excluibles en CI rápido)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # se permite assert en tests
